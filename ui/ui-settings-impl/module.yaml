product:
  type: kmp/lib
  platforms: [android, jvm, iosArm64, iosSimulatorArm64]

apply:
  - //templates/common.module-template.yaml
  - //templates/android.module-template.yaml
  - //templates/lib.module-template.yaml
  - //templates/compose.module-template.yaml
  - //templates/metro.module-template.yaml

dependencies:
  - //core/app-info: exported
  - //core/metro-common: exported
  - //core/navigation: exported
  - //core/resource-state: exported
  - //data/data-license-api: exported
  - //data/data-locale-api: exported
  - //data/data-theme-api: exported
  - //ui/ui-settings-api: exported
  - //core/design-system
  - //core/l10n
  - //core/ui
  - $libs.androidx.lifecycle.runtime.compose
  - $libs.jetbrains.compose.material3.adaptive.navigation3
  - $libs.metrox.viewmodel.compose

settings:
  android:
    namespace: app.rickandmorty.ui.settings
