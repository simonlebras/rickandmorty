name: Build

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run kempt
        uses: ZacSweers/kempt@main
        with:
          cache: true

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Check LFS files
        uses: actionsdesk/lfs-warning@v3.3

      - name: Cache Kotlin Toolchain
        uses: actions/cache@v6
        with:
          path: ~/.cache/JetBrains/Kotlin
          key: ${{ runner.os }}-kotlin-${{ hashFiles('kotlin', 'libs.versions.toml', '**/module.yaml', 'templates/*.yaml') }}
          restore-keys: ${{ runner.os }}-kotlin-

      - name: Decrypt secrets
        uses: ./.github/actions/decrypt-secrets
        with:
          key: ${{ secrets.DECRYPT_KEY }}
          keystore-password: ${{ secrets.ORG_GRADLE_PROJECT_RAM_RELEASE_KEYSTORE_PWD }}
          key-password: ${{ secrets.ORG_GRADLE_PROJECT_RAM_RELEASE_KEY_PWD }}

      - name: Build
        run: ./kotlin build --platform=android --platform=jvm

      - name: Run tests
        run: ./kotlin test --platform=jvm

      - name: Package release bundle
        run: ./kotlin package --module=app

      - name: Run checks
        run: ./kotlin check badging licenses --module=app

      - name: Upload build outputs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: build-outputs
          path: |
            build/tasks/_app_buildAndroidDebug/*.apk
            build/tasks/_app_bundleAndroid/*.aab
            build/tasks/_app_bundleAndroid/gradle-project/build/_app/outputs/mapping/release/mapping.txt

      - name: Clean secrets
        if: always()
        uses: ./.github/actions/clean-secrets
