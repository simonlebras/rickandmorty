product:
  type: kmp/lib
  platforms: [android, jvm, iosArm64, iosSimulatorArm64]

apply:
  - //templates/common.module-template.yaml
  - //templates/android.module-template.yaml
  - //templates/lib.module-template.yaml
  - //templates/compose.module-template.yaml

dependencies:
  - $libs.jetbrains.compose.resources: exported
  - $libs.jetbrains.compose.runtime

settings:
  android:
    namespace: app.rickandmorty.core.l10n
  compose:
    resources:
      packageName: app.rickandmorty.core.l10n.resources
      exposedAccessors: true
