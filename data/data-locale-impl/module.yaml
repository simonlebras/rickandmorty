product:
  type: kmp/lib
  platforms: [android, jvm, iosArm64, iosSimulatorArm64]

apply:
  - //templates/common.module-template.yaml
  - //templates/android.module-template.yaml
  - //templates/lib.module-template.yaml
  - //templates/metro.module-template.yaml

dependencies:
  - //core/coroutines: exported
  - //data/data-locale-api: exported

dependencies@android:
  - //core/metro-common: exported
  - $libs.androidx.appcompat

settings:
  android:
    namespace: app.rickandmorty.data.locale
